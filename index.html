<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>JLPT Daily</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <script src="application.js" defer></script>
    </head>

    <body>
        <header class="top-bar">
            <!-- Invisible left counterweight to keep the title centered horizontally -->
            <div class="spacer"></div>

            <h1 id="title">JLPT DAILY</h1>
            <!--Need to make a burger button on the top right to toggle the levels list where you can toggle levels to test one self -->
            <!--RADIO BUTTON FEATURE-->
            <!--example n5=false n4=true n3=false n2=false n1=false and beyond=false-->

            <div class="menu-wrapper">
                <button type="button" id="menu-btn" aria-label="Open settings">☰</button>

                <div id="settings-menu" class="dropdown hidden">
                    <!--Where the radio buttons go-->
                    <label><input type="radio" name="jlpt" value="n5" checked> N5</label>
                    <label><input type="radio" name="jlpt" value="n4"> N4</label>
                    <label><input type="radio" name="jlpt" value="n3"> N3</label>
                    <label><input type="radio" name="jlpt" value="n2"> N2</label>
                    <label><input type="radio" name="jlpt" value="n1"> N1</label>
                    <label><input type="radio" name="jlpt" value="beyond">Beyond JLPT</label>
                </div>
            </div>
        </header>

        <main>
        <p id="change_text">今日</p>
        <form>
            <input id="response" type="text" placeholder="Enter Your Answer Here">
            <button id="checking-response" type="submit">submit</button>
        </form>
        </main>
    </body>
</html>
